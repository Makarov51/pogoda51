
name: Update Murmansk RSS


on:
  schedule:
    - cron: '30,35,40 0,3,6,9,12,15,18,21 * * *'
      timezone: 'Europe/Moscow'
  workflow_dispatch:



permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch observations and build RSS
        run: python update_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "RSS is unchanged"
          else
            git commit -m "Update Murmansk SYNOP RSS"
            git push
          fi
